  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
  <!-- Top Visual Delight: Pending Pin Illustration -->
  <div class="flex flex-col items-center justify-center pt-space-lg pb-space-md text-center relative">
    <!-- Decorative Floating Hummingbird Motif -->
    <div class="absolute right-6 top-2 opacity-85 pointer-events-none transform rotate-12 transition-transform duration-700 hover:rotate-0">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Stylized Doctor Bird (Jamaican Swallowtail Hummingbird) -->
        <path d="M42 6C34 10 28 17 24 23L17 18C16 13 20 8 26 5L42 6Z" fill="#16a34a"/>
        <path d="M24 23C21 27 18 31 16 38L13 47C13 47 16 41 19 36C22 31 27 28 27 28L24 23Z" fill="#1e1b17"/>
        <path d="M19 23L9 16C5 13 4 8 7 7C10 6 15 11 19 19L19 23Z" fill="#eab308"/>
        <circle cx="28" cy="11" r="1.5" fill="#ffffff"/>
      </svg>
    </div>

    <!-- Main Pin Badge Illustration -->
    <div class="relative flex items-center justify-center w-28 h-28 mb-space-md">
      <!-- Ambient Sun-Warmed Glow -->
      <div class="absolute inset-0 rounded-full bg-secondary-container/20 blur-xl"></div>
      
      <!-- Dashed Rotating / Pulsing SVG Ring -->
      <svg class="absolute inset-0 w-full h-full transform -rotate-45" viewBox="0 0 112 112">
        <circle cx="56" cy="56" r="50" fill="none" stroke="#fd761a" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" class="opacity-90"/>
      </svg>

      <!-- Inner High-Contrast Badge Container -->
      <div class="relative flex items-center justify-center w-20 h-20 rounded-full bg-surface-container-lowest shadow-md">
        <!-- Sunset Gradient Core -->
        <div class="flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-primary to-secondary-container text-on-primary shadow-sm">
          <span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">add_location_alt</span>
        </div>
        
        <!-- Floating Status Sparkle / Clock Accent -->
        <div class="absolute -bottom-1 -right-1 flex items-center justify-center w-8 h-8 rounded-full bg-tertiary-fixed-dim text-on-tertiary-fixed shadow-md border-2 border-surface-container-lowest">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">schedule</span>
        </div>
      </div>
    </div>

    <!-- Island Flag Ribbon Micro Accent -->
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low shadow-sm mb-space-sm">
      <div class="flex items-center gap-0.5 overflow-hidden rounded-full w-4 h-2.5">
        <span class="w-1.5 h-full bg-[#16a34a]"></span>
        <span class="w-1 h-full bg-[#eab308]"></span>
        <span class="w-1.5 h-full bg-[#1e1b17]"></span>
      </div>
      <span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">Kingston &amp; St. Andrew Corridor</span>
    </div>

    <!-- Headline & Reassurance -->
    <h1 class="font-headline-md text-headline-md text-on-surface text-center mb-space-xs">
      Thanks! Your pin is awaiting approval
    </h1>
    <p class="font-body-md text-body-md text-on-surface-variant max-w-sm text-center leading-relaxed">
      The Roam team and parish moderators check every pin before it goes live on the island map. We&apos;ll notify you as soon as it&apos;s verified.
    </p>
  </div>

  <!-- Submission Summary Card -->
  <div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-md mb-space-md">
    <div class="flex items-start justify-between gap-space-sm pb-space-sm">
      <div class="flex items-start gap-space-sm min-w-0">
        <div class="flex items-center justify-center w-11 h-11 rounded-lg bg-surface-container text-primary shrink-0 shadow-sm">
          <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">local_gas_station</span>
        </div>
        <div class="min-w-0">
          <h2 class="font-headline-sm text-headline-sm text-on-surface truncate">TotalEnergies Half-Way-Tree</h2>
          <p class="font-body-sm text-body-sm text-on-surface-variant truncate">Constant Spring Rd, Kingston 10</p>
        </div>
      </div>
      <!-- Status Badge -->
      <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-tertiary-fixed text-on-tertiary-fixed shrink-0 shadow-sm">
        <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">hourglass_top</span>
        <span class="font-label-md text-label-md">Pending Review</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-space-sm pt-space-sm bg-surface-container-low rounded-lg p-space-sm">
      <div class="flex flex-col">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Category</span>
        <span class="font-label-lg text-label-lg text-on-surface flex items-center gap-1 mt-0.5">
          <span class="material-symbols-outlined text-[16px] text-primary">local_gas_station</span>
          Gas Station
        </span>
      </div>
      <div class="flex flex-col">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Est. Review Time</span>
        <span class="font-label-lg text-label-lg text-on-surface flex items-center gap-1 mt-0.5">
          <span class="material-symbols-outlined text-[16px] text-secondary">pace</span>
          ~2 to 4 hours
        </span>
      </div>
    </div>
  </div>

  <!-- Community Contribution Counter Card (Sunset Motoring Gradient) -->
  <div class="relative w-full rounded-xl overflow-hidden p-space-md mb-space-md bg-gradient-to-br from-primary-container via-secondary-container to-tertiary-fixed shadow-md text-on-primary">
    <!-- Ambient Overlay Graphics -->
    <div class="absolute -right-8 -bottom-8 opacity-15 pointer-events-none">
      <span class="material-symbols-outlined text-[160px]">emoji_events</span>
    </div>

    <div class="relative z-10 flex flex-col gap-space-sm">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container-lowest/20 backdrop-blur-sm">
            <span class="material-symbols-outlined text-[20px] text-on-primary" style="font-variation-settings: 'FILL' 1;">military_tech</span>
          </span>
          <span class="font-label-lg text-label-lg tracking-wide uppercase text-on-primary/90">Scout Network</span>
        </div>
        <span class="font-label-md text-label-md px-2.5 py-0.5 rounded-full bg-surface-container-lowest/25 backdrop-blur-sm text-on-primary">
          Rank: Parish Scout Level 2
        </span>
      </div>

      <div class="flex items-baseline justify-between mt-space-xs">
        <div>
          <div class="font-display-lg-mobile text-display-lg-mobile font-bold tracking-tight text-on-primary">
            12 Places
          </div>
          <p class="font-label-md text-label-md text-on-primary/90 -mt-1">Mapped across Jamaica</p>
        </div>
        <div class="text-right">
          <div class="inline-flex items-center gap-1 px-2 py-1 rounded-md bg-surface-container-lowest text-primary font-price-display text-price-display shadow-sm">
            +25
          </div>
          <span class="block font-label-sm text-label-sm text-on-primary/95 mt-1 font-semibold">Pending Points</span>
        </div>
      </div>

      <div class="pt-space-sm mt-space-xs bg-surface-container-lowest/15 rounded-lg p-2.5 backdrop-blur-sm">
        <p class="font-body-sm text-body-sm text-on-primary flex items-start gap-1.5 leading-snug">
          <span class="material-symbols-outlined text-[16px] shrink-0 mt-0.5 text-tertiary-fixed" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
          <span>Respect! Your pins have helped over <strong>3,400 Jamaican motorists</strong> find fuel, air, and repairs this month.</span>
        </p>
      </div>
    </div>
  </div>

  <!-- What Happens Next Timeline Card -->
  <div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-md mb-space-lg">
    <div class="flex items-center justify-between pb-space-sm mb-space-sm">
      <h3 class="font-headline-sm text-headline-sm text-on-surface">Verification Process</h3>
      <span class="font-label-sm text-label-sm px-2 py-0.5 rounded bg-surface-container text-on-surface-variant uppercase font-semibold">3-Step Check</span>
    </div>

    <div class="flex flex-col gap-space-md">
      <!-- Step 1: Automated GPS Corridor Verification (Completed) -->
      <div class="flex items-start gap-space-sm">
        <div class="flex flex-col items-center">
          <div class="flex items-center justify-center w-7 h-7 rounded-full bg-[#16a34a] text-surface-container-lowest shadow-sm">
            <span class="material-symbols-outlined text-[18px]">check</span>
          </div>
          <div class="w-0.5 h-7 bg-[#16a34a] mt-1 opacity-70"></div>
        </div>
        <div class="flex-1 min-w-0 pt-0.5">
          <div class="flex items-center justify-between">
            <span class="font-label-lg text-label-lg text-on-surface">Corridor GPS Check</span>
            <span class="font-label-sm text-label-sm text-[#16a34a] font-bold">Passed</span>
          </div>
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
            Geofence verified along Constant Spring arterial corridor.
          </p>
        </div>
      </div>

      <!-- Step 2: Moderator checks duplicate & photo (In queue) -->
      <div class="flex items-start gap-space-sm">
        <div class="flex flex-col items-center">
          <div class="flex items-center justify-center w-7 h-7 rounded-full bg-secondary-container text-on-secondary-container shadow-sm animate-pulse">
            <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">sync</span>
          </div>
          <div class="w-0.5 h-7 bg-surface-container-highest mt-1"></div>
        </div>
        <div class="flex-1 min-w-0 pt-0.5">
          <div class="flex items-center justify-between">
            <span class="font-label-lg text-label-lg text-on-surface">Duplicate &amp; Photo Audit</span>
            <span class="font-label-sm text-label-sm text-secondary font-bold">In Review</span>
          </div>
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
            Local Kingston moderators verifying site photos and fuel grade availability.
          </p>
        </div>
      </div>

      <!-- Step 3: Pin goes live on Jamaican radar + SMS alert sent -->
      <div class="flex items-start gap-space-sm">
        <div class="flex flex-col items-center">
          <div class="flex items-center justify-center w-7 h-7 rounded-full bg-surface-container text-on-surface-variant shadow-sm">
            <span class="material-symbols-outlined text-[16px]">sensors</span>
          </div>
        </div>
        <div class="flex-1 min-w-0 pt-0.5">
          <div class="flex items-center justify-between">
            <span class="font-label-lg text-label-lg text-on-surface-variant">Live Radar Broadcast</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant">Pending</span>
          </div>
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
            Pin activates across the Roam live map and confirms via instant SMS.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Primary and Secondary Actions -->
  <div class="flex flex-col gap-space-sm w-full">
    <!-- Primary CTA: Map Another Place -->
    <button type="button" class="w-full min-h-[48px] px-space-lg py-3 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:bg-on-primary-fixed-variant transition-colors">
      <span class="material-symbols-outlined text-[20px]">add_location</span>
      <span>Map Another Place</span>
    </button>

    <!-- Secondary CTA: Back to Map -->
    <button type="button" class="w-full min-h-[48px] px-space-lg py-3 rounded-lg bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-2 active:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined text-[20px] text-primary">map</span>
      <span>Back to Map</span>
    </button>

    <!-- Subtle Tertiary Link -->
    <div class="flex items-center justify-center pt-space-xs pb-space-sm">
      <a href="#submitted-places" class="font-label-md text-label-md text-secondary underline decoration-secondary/50 underline-offset-4 py-2 px-4 active:text-on-secondary-fixed-variant">
        View My Submitted Places (12)
      </a>
    </div>
  </div>
</div></main></body></html></script><style>

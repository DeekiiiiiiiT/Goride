, "outline-variant": "#e2bfb2", "surface": "#fff8f2" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-lg": "1.5rem", "space-xl": "2rem", "space-sm": "0.5rem", "margin": "1rem", "gutter-sm": "0.75rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem" }, "fontFamily": { "price-display": ["Inter"], "label-lg": ["Inter"], "display-lg-mobile": ["Inter"], "headline-sm": ["Inter"], "headline-lg": ["Inter"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "label-sm": ["Inter"], "body-sm": ["Inter"] }, "fontSize": { "price-display": ["24px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}], "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}], "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}], "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}], "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700"}], "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}], "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}], "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}], "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}], "label-sm": ["10px", {"lineHeight": "12px", "letterSpacing": "0.04em", "fontWeight": "700"}], "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);

  </style>
  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full pb-8 px-4">
<!-- Top Navigation Utility Bar -->
<header class="flex items-center justify-between py-3 w-full">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<button class="flex items-center gap-1 px-3 py-2 rounded-full bg-surface-container text-secondary font-label-lg text-label-lg active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">help_outline</span>
<span>Help</span>
</button>
</header>
<!-- Brand Delight Header -->
<section class="mt-4 flex flex-col items-start w-full">
<div class="relative flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary via-secondary-container to-tertiary-fixed-dim shadow-md mb-5 group">
<!-- Custom Roam Plug Pin & Spark Emblem -->
<svg class="w-9 h-9 text-on-primary drop-shadow-sm" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm-1 4h2v3h-2V6zm0 5h2v2h-2v-2zm-3-5h2v3H8V6zm6 0h2v3h-2V6z"></path>
</svg>
<!-- Playful ping accent -->
<span class="absolute -top-1 -right-1 flex h-3.5 w-3.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-primary"></span>
</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
      Welcome back
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 max-w-xs">
      Sign in to access your garage, synced odometer logs, and parish road pins.
    </p>
</section>
<!-- Login Form Section -->
<form class="mt-7 flex flex-col w-full" onsubmit="handleSendCode(event)">
<!-- Field Header -->
<div class="flex items-center justify-between mb-2">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="phone-input">
<span>Phone Number</span>
</label>
<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-sm text-label-sm tracking-wide uppercase">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
        Jamaica Mobile
      </span>
</div>
<!-- Phone Composite Input (52px Touch-Engineered) -->
<div class="relative flex items-center h-[52px] w-full rounded-xl bg-surface-container-lowest shadow-sm transition-all focus-within:shadow-md">
<!-- Fixed Country Code Picker Chip -->
<div class="flex items-center gap-1.5 px-3.5 h-full bg-surface-container-low rounded-l-xl select-none">
<span aria-label="Jamaica Flag" class="text-lg leading-none" role="img">🇯🇲</span>
<span class="font-label-lg text-label-lg text-on-surface font-bold tracking-tight">+1 876</span>
</div>
<!-- Numeric Input -->
<input autocomplete="tel-national" class="flex-1 h-full px-3.5 rounded-r-xl bg-transparent font-headline-sm text-headline-sm text-on-surface placeholder:text-outline/40 focus:outline-none" id="phone-input" inputmode="numeric" maxlength="8" placeholder="555-0199" required="" type="tel"/>
</div>
<!-- Microcopy / Island Reliability Note -->
<div class="flex items-start gap-1.5 mt-2.5 px-0.5">
<span class="material-symbols-outlined text-[16px] text-tertiary mt-0.5" style="font-variation-settings: 'FILL' 1;">sms</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        We'll text you a 6-digit one-time code. No password needed.
      </p>
</div>
<!-- Primary Action CTA -->
<button class="mt-6 flex items-center justify-center gap-2 w-full h-[52px] rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm shadow-md active:bg-primary-container active:scale-[0.99] transition-all" id="submit-btn" type="submit">
<span>Send Code</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Tactile Divider -->
<div class="relative flex items-center justify-center my-7 w-full">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface font-label-sm text-label-sm uppercase tracking-wider text-outline font-bold">
      Or continue with
    </span>
</div>
<!-- Social Authentication Methods (Strict min 48px hit targets, no borders) -->
<div class="flex flex-col gap-3 w-full">
<!-- Google Login -->
<button class="flex items-center justify-center gap-3 w-full h-[50px] px-4 rounded-xl bg-surface-container-lowest text-on-surface font-label-lg text-label-lg shadow-sm hover:bg-surface-container-low active:scale-[0.99] transition-all" onclick="handleSocial('Google')" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Apple Login -->
<button class="flex items-center justify-center gap-3 w-full h-[50px] px-4 rounded-xl bg-inverse-surface text-inverse-on-surface font-label-lg text-label-lg shadow-sm hover:opacity-95 active:scale-[0.99] transition-all" onclick="handleSocial('Apple')" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.67-.99 1.74-.85 2.76 1 .08 2-.51 2.58-1.26z"></path>
</svg>
<span>Continue with Apple</span>
</button>
</div>
<!-- Sign Up Account Switcher -->
<div class="mt-8 text-center w-full">
<p class="font-body-md text-body-md text-on-surface-variant">
      Don't have an account? 
      <button class="font-label-lg text-label-lg text-primary hover:underline ml-1 font-bold inline-flex items-center" type="button">
        Sign up
      </button>
</p>
</div>
<!-- Island Driver Trust & Pride Badge -->
<footer class="mt-10 mb-2 w-full flex flex-col items-center">
<div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant max-w-full text-center">
<span class="text-sm select-none">🇯🇲</span>
<span class="font-label-sm text-label-sm leading-tight text-on-surface">
        Built for Jamaican roads, route taxis &amp; road trips • 100% Free
      </span>
</div>
</footer>
</div>
<script>
  // Simple phone number auto-formatting micro-interaction
  const phoneInput = document.getElementById('phone-input');
  if (phoneInput) {
    phoneInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 3) {
        value = value.slice(0, 3) + '-' + value.slice(3, 7);
      }
      e.target.value = value;
    });
  }

  function handleSendCode(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    if (!btn) return;
    const originalContent = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Sending OTP...</span>`;
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Code Sent!</span>`;
      setTimeout(() => {
        btn.innerHTML = originalContent;
        btn.disabled = false;
      }, 1500);
    }, 800);
  }

  function handleSocial(provider) {
    console.log(`Connecting to ${provider}...`);
  }
</script></main></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garage - No Vehicles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff8f2',
              100: '#ffedd5',
              200: '#fed7aa',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            },
            surface: {
              DEFAULT: '#fff8f2',
              card: '#ffffff',
              subtle: '#faf2eb',
              border: '#f0e6dc',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #fff8f2;
      color: #1e293b;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="min-h-screen bg-[#fff8f2] flex flex-col justify-between max-w-md mx-auto shadow-2xl relative select-none">

  <!-- Top App Bar / Header -->
  <header class="px-5 pt-4 pb-3 flex items-center justify-between border-b border-[#f0e6dc] bg-[#fff8f2]/90 backdrop-blur-md sticky top-0 z-20">
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight text-neutral-900">My Garage</h1>
      <p class="text-xs font-semibold text-neutral-500 mt-0.5 flex items-center gap-1.5">
        <span class="inline-block w-2 h-2 rounded-full bg-neutral-300"></span>
        0 vehicles registered
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button class="w-10 h-10 rounded-full flex items-center justify-center text-neutral-700 hover:bg-neutral-200/50 active:scale-95 transition-all">
        <span class="material-symbols-outlined text-[22px]">notifications</span>
      </button>
      <button class="w-10 h-10 rounded-full flex items-center justify-center text-neutral-700 hover:bg-neutral-200/50 active:scale-95 transition-all">
        <span class="material-symbols-outlined text-[22px]">settings</span>
      </button>
      <button class="w-9 h-9 rounded-full bg-[#ea580c] text-white flex items-center justify-center text-sm font-bold shadow-sm active:scale-95 transition-all ml-1">
        <span class="material-symbols-outlined text-[20px]">person</span>
      </button>
    </div>
  </header>

  <!-- Main Empty State Content -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-8 text-center">
    
    <!-- Empty Garage Illustration -->
    <div class="w-64 h-52 mb-6 flex items-center justify-center relative">
      <img 
        src="https://lh3.googleusercontent.com/aida/AEtjO1W4LXCNEYzrab8pTLfas5Gq3H_WXx0APsj4K4IDFTyK7gY2v5uQEFnfyfUbf0eNBRyO_nzX288ak3Xo1ptR-dkw5jrW3v3Kpnh3IgNpQjyBcFtvbCAGqBnmKzfJWuKyRRu0pUw3PHlBrW4HPN12WWzf9eTbiweFNyqHPVqtBrS_If-npaS1VPu6njPAWyda_dJDt1LWK4ECUW9uCwv6FpEtz1bE-MdtGW2NeSwp2R1uw7fcdr7EYt-nkDE" 
        alt="Empty garage illustration" 
        class="w-full h-full object-contain drop-shadow-sm"
      />
    </div>

    <!-- Text Hierarchy -->
    <h2 class="text-2xl font-extrabold text-neutral-900 tracking-tight mb-2.5">
      No vehicles yet
    </h2>
    <p class="text-neutral-600 text-sm font-medium leading-relaxed max-w-[310px] mb-8">
      Add the car you drive so fuel logs and service reminders stay with it.
    </p>

    <!-- Orange Primary CTA -->
    <button class="w-full max-w-[320px] bg-[#ea580c] hover:bg-[#c2410c] text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-orange-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2.5 group">
      <span class="material-symbols-outlined text-[22px] group-hover:scale-110 transition-transform">add_circle</span>
      <span class="text-base tracking-wide">Add a vehicle</span>
    </button>

    <!-- Subtle helper callout / Island motoring reassurance -->
    <div class="mt-8 pt-6 border-t border-[#f0e6dc]/80 w-full max-w-[320px] flex items-center justify-center gap-2 text-xs font-semibold text-neutral-500">
      <span class="material-symbols-outlined text-[18px] text-[#ea580c]">verified_user</span>
      <span>Supports JDM imports, taxis & local models</span>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="sticky bottom-0 left-0 right-0 w-full bg-[#ffffff] border-t border-[#f0e6dc] shadow-[0_-4px_20px_rgba(0,0,0,0.04)] z-30 px-3 pb-safe">
    <div class="flex items-center justify-between h-16 max-w-md mx-auto relative">
      
      <!-- Tab 1: Explore -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 text-neutral-500 hover:text-neutral-800 transition-colors">
        <span class="material-symbols-outlined text-[24px]">explore</span>
        <span class="text-[11px] font-semibold mt-0.5">Explore</span>
      </button>

      <!-- Tab 2: Garage (Selected) -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 text-[#ea580c] transition-colors relative">
        <span class="material-symbols-outlined fill text-[24px]">directions_car</span>
        <span class="text-[11px] font-bold mt-0.5">Garage</span>
        <span class="absolute bottom-1 w-1.5 h-1.5 rounded-full bg-[#ea580c]"></span>
      </button>

      <!-- Tab 3: Raised Center Log Fuel -->
      <div class="flex-1 flex flex-col items-center justify-center relative -top-3">
        <button class="w-14 h-14 rounded-full bg-gradient-to-tr from-[#c2410c] to-[#ea580c] text-white flex items-center justify-center shadow-lg shadow-orange-500/35 border-4 border-[#fff8f2] active:scale-95 transition-all">
          <span class="material-symbols-outlined fill text-[26px]">local_gas_station</span>
        </button>
        <span class="text-[10px] font-extrabold text-[#ea580c] uppercase tracking-wider mt-0.5">Log Fuel</span>
      </div>

      <!-- Tab 4: Map It -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 text-neutral-500 hover:text-neutral-800 transition-colors">
        <span class="material-symbols-outlined text-[24px]">map</span>
        <span class="text-[11px] font-semibold mt-0.5">Map It</span>
      </button>

      <!-- Tab 5: Account -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 text-neutral-500 hover:text-neutral-800 transition-colors">
        <span class="material-symbols-outlined text-[24px]">account_circle</span>
        <span class="text-[11px] font-semibold mt-0.5">Account</span>
      </button>

    </div>
  </nav>

</body>
</html>

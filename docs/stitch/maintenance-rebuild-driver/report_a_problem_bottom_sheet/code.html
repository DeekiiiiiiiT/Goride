<script>
  (function() {
    const submitBtn = document.getElementById('submit-report-btn');
    if (submitBtn) {
      submitBtn.addEventListener('click', function() {
        const originalContent = this.innerHTML;
        this.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-bounce">check_circle</span><span>Report logged! Fleet notified</span>';
        this.classList.remove('bg-primary');
        this.classList.add('bg-primary-container');
        setTimeout(() => {
          this.innerHTML = originalContent;
          this.classList.remove('bg-primary-container');

    }
  })();

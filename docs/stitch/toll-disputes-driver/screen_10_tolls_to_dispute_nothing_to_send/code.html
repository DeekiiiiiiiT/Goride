<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen 10: Tolls to Dispute — Nothing to Send</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center p-0 sm:py-6">
  <!-- Mobile Container (390px) -->
  <div class="w-full max-w-[390px] min-h-screen bg-slate-100 flex flex-col justify-between shadow-2xl relative">
    
    <!-- Top Bar -->
    <div class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
      <button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-800 transition active:scale-95" aria-label="Go back">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
      </button>
      <h1 class="text-[17px] font-semibold text-slate-900 tracking-tight">Tolls to dispute</h1>
      <button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 transition" aria-label="Help">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9a2.25 2.25 0 114.5 0c0 1.5-1.5 2.25-1.5 3m0 3.75h.008v.008H12.75v-.008z"/>
        </svg>
      </button>
    </div>

    <!-- Middle Content Area (Empty State) -->
    <div class="flex-1 flex flex-col items-center justify-center px-6 py-10">
      
      <!-- Friendly Empty State Graphic -->
      <div class="w-20 h-20 rounded-full bg-emerald-50 border-2 border-emerald-100 flex items-center justify-center mb-5 shadow-sm">
        <svg class="w-10 h-10 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
        </svg>
      </div>

      <!-- Title & Reassuring Copy -->
      <h2 class="text-[20px] font-bold text-slate-900 tracking-tight text-center">
        No tolls to dispute
      </h2>
      <p class="text-[15px] text-slate-600 text-center mt-2 leading-relaxed max-w-[280px]">
        When Uber pays back less than a toll on one of your trips, it shows up here.
      </p>

      <!-- Sent Tolls Summary Card -->
      <div class="mt-8 w-full bg-white rounded-2xl p-4 border border-slate-200/80 shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(15,23,42,0.06)] flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <span class="text-[14px] font-medium text-slate-700">Sent and waiting on Uber</span>
          <span class="text-[14px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100 tabular-nums">
            3 · J$60.00
          </span>
        </div>
        <button class="w-full h-11 bg-white hover:bg-slate-50 border border-slate-300 active:border-slate-400 rounded-xl text-[14px] font-semibold text-slate-800 flex items-center justify-center gap-1.5 shadow-sm transition active:scale-[0.99]">
          <span>See sent tolls</span>
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Bottom Navigation Bar (Roam standard) -->
    <nav class="bg-white border-t border-slate-200 px-6 py-2 flex items-center justify-between sticky bottom-0 z-20">
      <div class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 cursor-pointer min-w-[56px] py-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
        </svg>
        <span class="text-[11px] font-medium mt-1">Home</span>
      </div>

      <div class="flex flex-col items-center justify-center text-emerald-600 cursor-pointer min-w-[56px] py-1">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19 7h-1V6a3 3 0 00-3-3H5a3 3 0 00-3 3v9a3 3 0 003 3h1a2 2 0 004 0h4a2 2 0 004 0h1a3 3 0 003-3v-5a3 3 0 00-3-3zm-14-2h10a1 1 0 011 1v1H4V6a1 1 0 011-1zm3 14a1 1 0 110-2 1 1 0 010 2zm10 0a1 1 0 110-2 1 1 0 010 2zm2-4a1 1 0 01-1 1h-.17a2.988 2.988 0 00-5.66 0H8.83a2.988 2.988 0 00-5.66 0H3a1 1 0 01-1-1V9h16v6z"/>
        </svg>
        <span class="text-[11px] font-semibold mt-1">Trips</span>
      </div>

      <div class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 cursor-pointer min-w-[56px] py-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33"/>
        </svg>
        <span class="text-[11px] font-medium mt-1">Earnings</span>
      </div>

      <div class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 cursor-pointer min-w-[56px] py-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1.5"/>
          <circle cx="12" cy="12" r="1.5"/>
          <circle cx="19" cy="12" r="1.5"/>
        </svg>
        <span class="text-[11px] font-medium mt-1">More</span>
      </div>
    </nav>
  </div>
</body>
</html>

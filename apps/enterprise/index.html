<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#030213" />
    <meta
      name="description"
      content="Roam Enterprise — Courier and Warehouse products for logistics operators."
    />
    <meta name="application-name" content="Roam Enterprise" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roam Enterprise" />
    <!-- Manifest / installability only attached on courier.* and warehouse.* doors -->
    <link id="pwa-manifest" rel="manifest" href="/manifests/courier.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Roam Enterprise</title>
    <script>
      (function () {
        var host = (location.hostname || '').toLowerCase();
        var isWarehouse =
          host === 'warehouse.localhost' ||
          host.indexOf('warehouse.') === 0 ||
          host === 'warehouse';
        var isCourier =
          host === 'courier.localhost' ||
          host.indexOf('courier.') === 0 ||
          host === 'courier';
        var isOpsDoor = isWarehouse || isCourier;
        var link = document.getElementById('pwa-manifest');

        if (isOpsDoor) {
          if (link) {
            link.setAttribute(
              'href',
              isWarehouse ? '/manifests/warehouse.webmanifest' : '/manifests/courier.webmanifest',
            );
          }
          var capable = document.createElement('meta');
          capable.setAttribute('name', 'apple-mobile-web-app-capable');
          capable.setAttribute('content', 'yes');
          document.head.appendChild(capable);
          var mobileCapable = document.createElement('meta');
          mobileCapable.setAttribute('name', 'mobile-web-app-capable');
          mobileCapable.setAttribute('content', 'yes');
          document.head.appendChild(mobileCapable);
        } else {
          // Apex marketing: tear out any PWA installability BEFORE React boots.
          if (link && link.parentNode) link.parentNode.removeChild(link);
          document.querySelectorAll('link[rel="manifest"]').forEach(function (el) {
            el.parentNode && el.parentNode.removeChild(el);
          });
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister();
              });
            });
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                caches.delete(key);
              });
            });
          }
        }

        var title = isWarehouse
          ? 'Roam Freight Forwarding'
          : isCourier
            ? 'Roam Courier'
            : 'Roam Enterprise';
        document.title = title;
        var appMeta = document.querySelector('meta[name="application-name"]');
        if (appMeta) appMeta.setAttribute('content', title);
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.setAttribute('content', title);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>Offline — Roam Rush Partner</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff8f5;
        --card: #ffffff;
        --text: #1c1b1a;
        --muted: #6b7280;
        --accent: #10b981;
        --accent-dark: #006c49;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(ellipse at top, #d1fae5 0%, var(--bg) 55%);
        color: var(--text);
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: var(--accent);
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 650;
        color: var(--accent-dark);
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 650;
        font-size: 0.95rem;
        padding: 12px 20px;
        cursor: pointer;
        min-height: 44px;
      }
      button:hover { filter: brightness(1.05); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill="#fff" d="M20 18h24v6H34v22h-4V24H20v-6zm8 32h8v6h-8v-6z"/>
        </svg>
      </div>
      <h1>You’re offline</h1>
      <p>
        Roam Rush Partner needs a connection to show live orders and menu updates.
        Reconnect, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.recon-worker
      - --build-arg
      - CACHEBUST=$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/recon-worker:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/recon-worker
      - .
  # Push BEFORE deploy. The `images:` list below is only pushed when the whole build ends,
  # so deploying the bare tag here ran the PREVIOUS build's image (one version behind).
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/recon-worker:$BUILD_ID]
  # Asleep until the database wakes it. Minimum 0, one job at a time, CPU only while that job runs.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - recon-worker
      - --project
      - $PROJECT_ID
      - --region
      - us-east1
      - --image
      - gcr.io/$PROJECT_ID/recon-worker:$BUILD_ID
      - --platform
      - managed
      - --quiet
      - --min-instances
      - "0"
      - --max-instances
      - "1"
      - --concurrency
      - "1"
      - --cpu
      - "1"
      - --memory
      - 1Gi
      - --cpu-throttling
      - --timeout
      - "120"
      - --port
      - "8080"
      - --no-allow-unauthenticated
      - --set-secrets
      # New secret-key format (rotation plan, phase 4). ONE-TIME step in Secret Manager before the
      # next worker deploy, or Cloud Run refuses the revision:
      #   gcloud secrets create SUPABASE_SECRET_KEYS --replication-policy=automatic
      #   printf '%s' "$SUPABASE_SECRET_KEYS" | gcloud secrets versions add SUPABASE_SECRET_KEYS --data-file=-
      # The worker's own code does not read the key today (it is a pure week calculator); the mount
      # is here so any DB code added later gets the rotated key, not the legacy one.
      - SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SECRET_KEYS=SUPABASE_SECRET_KEYS:latest
images:
  - gcr.io/$PROJECT_ID/recon-worker

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.recon-worker
      - --build-arg
      - CACHEBUST=$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/recon-worker:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/recon-worker
      - .
  # Push BEFORE deploy. The `images:` list below is only pushed when the whole build ends,
  # so deploying the bare tag here ran the PREVIOUS build's image (one version behind).
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/recon-worker:$BUILD_ID]
  # Asleep until the database wakes it. Minimum 0, one job at a time, CPU only while that job runs.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - recon-worker
      - --project
      - $PROJECT_ID
      - --region
      - us-east1
      - --image
      - gcr.io/$PROJECT_ID/recon-worker:$BUILD_ID
      - --platform
      - managed
      - --quiet
      - --min-instances
      - "0"
      - --max-instances
      - "1"
      - --concurrency
      - "1"
      - --cpu
      - "1"
      - --memory
      - 1Gi
      - --cpu-throttling
      - --timeout
      - "120"
      - --port
      - "8080"
      - --no-allow-unauthenticated
      - --set-secrets
      - SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
images:
  - gcr.io/$PROJECT_ID/recon-worker

# Weekly fuel-stop location health checks (C1–C9) — alert only, never auto-fix.
name: Fuel stop location health

on:
  schedule:
    # Mondays 14:00 UTC
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  health-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run C1–C9 against Supabase
        env:
          # Prefer passworded URI when present; else CLI login role via access token.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] && [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Need passworded SUPABASE_DB_URL or SUPABASE_ACCESS_TOKEN — fail-closed."
            exit 1
          fi
          node scripts/check-fuel-stop-location-health.mjs

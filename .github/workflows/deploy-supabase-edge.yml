# Deploy Edge Functions when supabase/functions (or this workflow) changes on `main`.
# Required repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
#
# Only deploys functions whose folders changed. Shared/_fleet-server changes
# redeploy all (or the dependents). Manual "Run workflow" can force deploy-all.
#
# Supabase occasionally returns HTTP 502 while uploading (--use-api); we retry.
name: Deploy Supabase Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-edge.yml"
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Deploy all 18 edge functions (ignore path filter)"
        type: boolean
        default: false

concurrency:
  group: deploy-supabase-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Supabase CLI
        env:
          SUPABASE_CLI_VERSION: "2.99.0"
        run: |
          set -euo pipefail
          url="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/supabase.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin
          supabase --version

      - name: Deploy changed Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEPLOY_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all || 'false' }}
        run: |
          set -u
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF secrets."
            exit 1
          fi

          ALL_FNS=(
            make-server-37f42386
            delivery
            merchant-push
            payments
            send-sms
            rides
            driver
            haul
            toll-brain
            fuel-brain
            matching
            identity
            evidence-cleanup
            petrojam-prices
            fleet-ops
            platform-catalog
            before-user-created
            custom-access-token
          )

          deploy_with_retry() {
            fn="$1"
            max=4
            n=0
            while [ "$n" -lt "$max" ]; do
              n=$((n+1))
              echo ">>> Deploying ${fn} (attempt ${n}/${max})..."
              if supabase functions deploy "$fn" --use-api --project-ref "$SUPABASE_PROJECT_REF"; then
                echo ">>> ${fn} OK"
                return 0
              fi
              if [ "$n" -lt "$max" ]; then
                echo ">>> ${fn} failed; waiting 45s before retry (502 during upload is often transient)..."
                sleep 45
              fi
            done
            echo ">>> ${fn} failed after ${max} attempts."
            return 1
          }

          CHANGED_FILES=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            CHANGED_FILES="$(git diff --name-only HEAD^ HEAD || true)"
          else
            DEPLOY_ALL=true
          fi

          echo "=== Changed files ==="
          echo "$CHANGED_FILES"
          echo "====================="

          FNS=()
          should_all=false

          if [ "$DEPLOY_ALL" = "true" ]; then
            should_all=true
          elif echo "$CHANGED_FILES" | grep -qE '^supabase/functions/_shared/|^supabase/config\.toml|^\.github/workflows/deploy-supabase-edge\.yml'; then
            # Shared helpers / config / workflow itself → full redeploy
            should_all=true
          fi

          if [ "$should_all" = "true" ]; then
            FNS=("${ALL_FNS[@]}")
            echo ">>> Deploying ALL functions (shared change or manual deploy_all)"
          else
            for fn in "${ALL_FNS[@]}"; do
              if echo "$CHANGED_FILES" | grep -q "^supabase/functions/${fn}/"; then
                FNS+=("$fn")
              fi
            done
            # Fleet monolith tree feeds these entrypoints
            if echo "$CHANGED_FILES" | grep -q '^supabase/functions/_fleet-server/'; then
              for dep in make-server-37f42386 evidence-cleanup fleet-ops; do
                already=false
                for f in "${FNS[@]+"${FNS[@]}"}"; do
                  [ "$f" = "$dep" ] && already=true && break
                done
                if [ "$already" = "false" ]; then
                  FNS+=("$dep")
                fi
              done
            fi
          fi

          if [ ${#FNS[@]} -eq 0 ]; then
            echo ">>> No edge functions changed — nothing to deploy."
            exit 0
          fi

          echo ">>> Functions to deploy: ${FNS[*]}"
          for fn in "${FNS[@]}"; do
            deploy_with_retry "$fn" || exit 1
          done

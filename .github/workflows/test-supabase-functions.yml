# Runs the Deno-native test suites under supabase/functions/** (Deno.test + https: imports).
# These do NOT run via Vitest/pnpm build (apps/fleet/vite.config.ts explicitly excludes
# supabase/functions/** from its test include), so this workflow is the only gate on
# edge-function logic — including the toll controller, geofence core, and rate schedule.
name: Test Supabase Functions

# Only when edge functions change (pairs with Deploy; avoids noise on app-only syncs).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/test-supabase-functions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/test-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno test suites
        # Several modules build a Supabase client at import time, so the client
        # constructor needs a URL and key present before the graph is evaluated.
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key
        run: |
          set -euo pipefail
          deno test --no-check --allow-env --allow-net --allow-read supabase/functions/

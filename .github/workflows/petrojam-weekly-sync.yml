name: Petrojam weekly sync

on:
  schedule:
    # Mondays 14:00 UTC — Petrojam typically publishes weekly
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  sync-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Petrojam latest prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secrets"
            exit 1
          fi
          # Always auth with service_role key. Optional CRON_SECRET is a separate header only.
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s/^[[:space:]]*//')"
          SERVICE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s/^[[:space:]]*//')"
          CRON_VAL="$(printf '%s' "${CRON_SECRET:-}" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s/^[[:space:]]*//')"

          CURL_ARGS=(
            -sS -w "\nHTTP_CODE:%{http_code}\n"
            -X POST
            "${SUPABASE_URL}/functions/v1/petrojam-prices/cron/sync-latest"
            -H "Authorization: Bearer ${SERVICE_KEY}"
            -H "apikey: ${SERVICE_KEY}"
            -H "Content-Type: application/json"
          )
          if [ -n "$CRON_VAL" ]; then
            CURL_ARGS+=(-H "x-fleet-cron-secret: ${CRON_VAL}")
          fi

          RESP="$(curl "${CURL_ARGS[@]}")"
          echo "$RESP" | grep -q 'HTTP_CODE:200' || {
            echo "Sync failed (expected HTTP 200)"
            echo "$RESP" | tail -c 400
            exit 1
          }
          echo "Sync OK"

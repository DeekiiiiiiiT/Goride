name: Petrojam weekly sync

on:
  # Schedule moved to Supabase pg_cron job petrojam-weekly-sync (24 Nov 2026). Manual run only.
  workflow_dispatch:

jobs:
  sync-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Petrojam latest prices
        # Auth: the cron secret only. verify_jwt is off for petrojam-prices, and that function
        # now accepts the cron secret instead of comparing callers against the legacy key.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FLEET_CRON_SECRET: ${{ secrets.FLEET_CRON_SECRET }}
        run: |
          set -euo pipefail
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s/^[[:space:]]*//')"
          CRON_VAL="$(printf '%s' "${CRON_SECRET:-${FLEET_CRON_SECRET:-}}" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s/^[[:space:]]*//')"
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_VAL" ]; then
            echo "Missing SUPABASE_URL or the cron secret (CRON_SECRET / FLEET_CRON_SECRET)"
            exit 1
          fi

          CURL_ARGS=(
            -sS -w "\nHTTP_CODE:%{http_code}\n"
            -X POST
            "${SUPABASE_URL}/functions/v1/petrojam-prices/cron/sync-latest"
            -H "Content-Type: application/json"
            -H "x-fleet-cron-secret: ${CRON_VAL}"
          )

          RESP="$(curl "${CURL_ARGS[@]}")"
          echo "$RESP" | grep -q 'HTTP_CODE:200' || {
            echo "Sync failed (expected HTTP 200). An error run returns HTTP 500."
            echo "$RESP" | tail -c 400
            exit 1
          }
          echo "$RESP" | grep -q '"ok":false' && {
            echo "Sync reported an error run"
            echo "$RESP" | tail -c 400
            exit 1
          }
          echo "Sync OK"

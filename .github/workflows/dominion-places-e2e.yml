name: Dominion places checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/dominion-places.spec.ts'
      - 'playwright.dominion.config.ts'
      - 'packages/platform-ops-ui/src/places/**'
      - 'apps/admin/src/components/admin/places/**'
      - '.github/workflows/dominion-places-e2e.yml'

jobs:
  places-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Places register
        run: npx playwright test -c playwright.dominion.config.ts

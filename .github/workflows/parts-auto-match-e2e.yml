name: Parts auto-match Stitch e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CI: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auto_match: ${{ steps.filter.outputs.auto_match }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "auto_match=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "auto_match=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only "$BASE" "${{ github.sha }}")
          auto_match=false
          for f in "${CHANGED[@]}"; do
            case "$f" in
              apps/admin/src/components/admin/vehicle-catalog/*|\
              apps/admin/src/components/admin/platforms/*|\
              apps/admin/src/components/admin/parts-sourcing/CatalogQualityPage.tsx|\
              apps/admin/src/components/admin/parts-database/find-parts/*|\
              apps/admin/src/components/admin/parts-database/add-parts/*|\
              apps/admin/src/components/admin/parts-database/full-database/*|\
              apps/admin/src/services/partsAutoMatchApi.ts|\
              apps/fleet/src/components/vehicles/find-parts/*|\
              supabase/functions/_fleet-server/parts_auto_match_routes.ts|\
              supabase/functions/_fleet-server/parts_finder.ts|\
              supabase/functions/_fleet-server/catalog_routes.ts|\
              supabase/migrations/*add_a_part*|\
              supabase/migrations/*parts_auto_match*|\
              supabase/migrations/20261105100000_parts_auto_match_rev12_hotfix.sql|\
              supabase/migrations/20261105120000_parts_auto_match_rev12_audit.sql|\
              supabase/migrations/20261106120000_parts_auto_match_rev13_closeout.sql|\
              supabase/migrations/20261107120000_parts_for_vehicle_live_tiebreak.sql|\
              supabase/migrations/20261107130000_part_match_archive_removal_cause.sql|\
              supabase/migrations/20261107140000_part_match_trg_listing_scope_backfill.sql|\
              supabase/migrations/20261107150000_part_match_derived_keep_pfd_alias.sql|\
              supabase/migrations/20261107160000_part_import_undo_pic_alias.sql|\
              supabase/migrations/20261107170000_vehicle_oe_number_revision_drop_fkey.sql|\
              supabase/migrations/20261107180000_part_match_scope_truncate_cleanup.sql|\
              supabase/migrations/20261107190000_part_match_scope_delete_cleanup.sql|\
              supabase/migrations/20261107200000_part_match_sync_conflicts_manual_note.sql|\
              supabase/migrations/20261107210000_part_match_recompute_batch_scope_gid.sql|\
              supabase/migrations/20261107220000_part_match_sync_conflicts_reopen_identity.sql|\
              supabase/migrations/20261107230000_part_match_conflict_open_key_oe.sql|\
              supabase/migrations/20261107240000_parts_for_vehicle_universal.sql|\
              supabase/tests/parts_auto_match_checks.sql|\
              e2e/parts-auto-match-stitch.spec.ts|\
              e2e/add-a-part-stitch.spec.ts|\
              e2e/add-a-part-done.spec.ts|\
              e2e/partsAutoMatchMocks.ts|\
              playwright.config.ts|\
              .github/workflows/parts-auto-match-e2e.yml)
                auto_match=true
                break
                ;;
            esac
          done
          echo "auto_match=$auto_match" >> "$GITHUB_OUTPUT"

  dominion-auto-match-stitch:
    needs: changes
    if: needs.changes.outputs.auto_match == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: Build admin
        # Without Supabase config the app shows its setup screen. "example" matches the sb-example-auth-token session the specs seed; mocks catch the API host.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/admin run build
      - name: Dominion auto-match Stitch spec
        env:
          FLEET_BASE_URL: http://127.0.0.1:3000
        run: node node_modules/@playwright/test/cli.js test e2e/parts-auto-match-stitch.spec.ts --project=dominion-admin
      - name: Add parts self-serve Stitch spec
        env:
          FLEET_BASE_URL: http://127.0.0.1:3000
        run: node node_modules/@playwright/test/cli.js test e2e/add-a-part-stitch.spec.ts --project=dominion-admin
      - name: Add parts behavioural done spec
        env:
          FLEET_BASE_URL: http://127.0.0.1:3000
        run: node node_modules/@playwright/test/cli.js test e2e/add-a-part-done.spec.ts --project=dominion-admin

  fleet-auto-match-s4f:
    needs: changes
    if: needs.changes.outputs.auto_match == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: Build fleet
        # Without Supabase config the app shows its setup screen. "example" matches the sb-example-auth-token session the specs seed; mocks catch the API host.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/fleet run build
      - name: Fleet AM-S4F Stitch spec
        env:
          ADMIN_BASE_URL: http://127.0.0.1:4173
        run: node node_modules/@playwright/test/cli.js test e2e/parts-auto-match-stitch.spec.ts --project=fleet -g "AM-S4F"

  parts-auto-match-stitch-e2e:
    name: Parts auto-match Stitch e2e
    needs: [changes, dominion-auto-match-stitch, fleet-auto-match-s4f]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report required gate
        shell: bash
        run: |
          if [ "${{ needs.changes.outputs.auto_match }}" != "true" ]; then
            echo "Auto-match paths unchanged — required check passes (skipped)."
            exit 0
          fi
          if [ "${{ needs.dominion-auto-match-stitch.result }}" != "success" ]; then
            echo "Dominion auto-match stitch failed or was cancelled."
            exit 1
          fi
          if [ "${{ needs.fleet-auto-match-s4f.result }}" != "success" ]; then
            echo "Fleet AM-S4F stitch failed or was cancelled."
            exit 1
          fi
          echo "All parts auto-match stitch checks passed."

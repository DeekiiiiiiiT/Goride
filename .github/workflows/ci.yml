        run: pnpm --filter @roam/fleet check:drivers

      - name: Typecheck admin money spine
        run: pnpm --filter @roam/admin typecheck:money

      # deno.json nodeModulesDir lets the Deno steps above re-link node_modules into node_modules/.deno;
      # Vite then resolves broken copies (e.g. @radix-ui/react-slot). Restore pnpm's links before building.
      - name: Restore pnpm links after Deno steps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # Scans only the commits in this push / PR, so a new secret fails CI.
  # Settings and allowlist: .gitleaks.toml. Mark a known-safe test value with `// gitleaks:allow (reason)`.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan new commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$SHA"
          else
            RANGE="$SHA~1..$SHA"
          fi
          echo "Scanning $RANGE"
          gitleaks detect --source . --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1

  inventory:
    needs: changes
    if: needs.changes.outputs.inventory == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check fleet inventory gap audit greps
        run: node scripts/assert-inventory-gap-audit.mjs

      - name: Check fleet inventory TypeScript
        run: node scripts/typecheck-fleet-inventory.mjs

      - name: Check driver car-kit TypeScript
        run: node scripts/typecheck-driver-car-kit.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli

      - name: Inventory done-tests (local Supabase + Playwright)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          INVENTORY_TEST_ORG_ID: test-org-inv
          INVENTORY_E2E: "1"
          INVENTORY_E2E_SUPABASE_PROJECT_REF: Goride
          FLEET_BASE_URL: http://127.0.0.1:3000
          DRIVER_BASE_URL: http://127.0.0.1:5174
        run: node scripts/run-inventory-done-tests.mjs

      - name: Upload inventory done-test screenshots
        if: failure()
        uses: actions/upload-artifact@v4

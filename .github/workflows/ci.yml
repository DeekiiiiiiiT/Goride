name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toll-core parity
        run: node scripts/check-toll-core-parity.mjs

      - name: Check settlement predicate parity
        run: node scripts/verify_settlement_predicate_parity.mjs

      - name: Check projection flags wired
        run: node scripts/check-projection-flags-wired.mjs

      - name: Check fuel-core parity
        run: node scripts/check-fuel-core-parity.mjs

      - name: Check toll org-scope
        run: node scripts/check-toll-org-scope.mjs

      - name: Check fuel org-scope
        run: node scripts/check-fuel-org-scope.mjs

      - name: Test toll-core
        run: pnpm --filter @roam/toll-core test

      - name: Test fuel-core
        run: pnpm --filter @roam/fuel-core test

      - name: Test finance-core
        run: pnpm --filter @roam/finance-core test

      - name: Test dash-pricing
        run: pnpm --filter @roam/dash-pricing test

      - name: Test dash-customer
        run: pnpm --filter @roam/dash-customer test

      - name: Test dash-courier
        run: pnpm --filter @roam/dash-courier test

      - name: Test dash-merchant
        run: pnpm --filter @roam/dash-merchant test

      - name: Test fleet
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/fleet test

      - name: Test admin
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/admin test

      - name: Check courier fleet stamp
        run: node scripts/check-courier-fleet-stamp.mjs

      - name: Check fleet edge duplicates
        run: node scripts/check-fleet-edge-duplicates.mjs

      - name: Deno check edge functions
        run: deno check supabase/functions/_shared/orderToFleetTrip.ts supabase/functions/_fleet-server/workforce_invite_routes.ts supabase/functions/_fleet-server/rush_settlement_routes.ts supabase/functions/delivery/courierFleetAttribution.ts

      - name: Typecheck fleet
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/fleet typecheck

      - name: Ban Figma-style package@version imports
        run: node scripts/check-no-versioned-imports.mjs

      - name: Ban bare @roam imports in fleet edge graph
        run: node scripts/check-fleet-edge-roam-imports.mjs

      - name: Typecheck rush-command
        run: pnpm --filter @roam/rush-command typecheck

      - name: Typecheck fuel-core
        run: pnpm --filter @roam/fuel-core typecheck

      - name: Typecheck fleet money spine
        run: pnpm --filter @roam/fleet typecheck:money

      - name: Typecheck admin money spine
        run: pnpm --filter @roam/admin typecheck:money

      - name: Build
        run: pnpm build

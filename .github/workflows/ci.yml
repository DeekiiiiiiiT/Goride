name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check no edge→fleet imports
        run: node scripts/check-no-edge-fleet-imports.mjs

      - name: Check Dominion is the only Jamaica map
        run: node scripts/check-no-hardcoded-jamaica.mjs

      - name: Check Rush no longer names the old border table
        run: node scripts/geo-phase5-precheck.mjs

      - name: Check no admin→fleet imports
        run: node scripts/check-no-admin-fleet-imports.mjs

      - name: Check toll-core parity
        run: node scripts/check-toll-core-parity.mjs

      - name: Check settlement predicate parity
        run: node scripts/verify_settlement_predicate_parity.mjs

      - name: Check service-line filter parity
        run: node scripts/verify_service_line_filter_parity.mjs

      - name: Check ledger view invoker
        run: node scripts/assert-ledger-view-invoker.mjs

      - name: Check public function revoke from anon
        run: node scripts/assert-public-fn-revoke-anon.mjs

      - name: Check no settlement saveTransaction fallback
        run: node scripts/assert-no-settlement-saveTransaction-fallback.mjs

      - name: Check remittance separation
        env:
          REMITTANCE_S6_DIFF: '1'
        run: node scripts/check-remittance-separation.mjs

      - name: Check projection flags wired
        run: node scripts/check-projection-flags-wired.mjs

      - name: Check fuel-core parity
        run: node scripts/check-fuel-core-parity.mjs

      - name: Check no naive date slice (one-week rule)
        run: node scripts/check-no-naive-date-slice.mjs

      - name: Check toll org-scope
        run: node scripts/check-toll-org-scope.mjs

      - name: Check client route contract
        run: node scripts/check-client-route-contract.mjs

      - name: Check no ledger fetch-all pattern (L-14)
        run: node scripts/assert-no-ledger-fetch-all.mjs

      - name: Check fuel org-scope
        run: node scripts/check-fuel-org-scope.mjs

      - name: Check statement summary org-scope
        run: node scripts/check-statement-org-scope.mjs

      - name: Check no client service-line derivation (fuel)
        run: node scripts/check-no-client-service-line-derivation.mjs

      - name: Test toll-core
        run: pnpm --filter @roam/toll-core test

      - name: Test fuel-core
        run: pnpm --filter @roam/fuel-core test

      - name: Test finance-core
        run: pnpm --filter @roam/finance-core test

      - name: Test dash-pricing
        run: pnpm --filter @roam/dash-pricing test

      - name: Test menu-engine
        run: pnpm --filter @roam/menu-engine test

      - name: Test menu-builder
        run: pnpm --filter @roam/menu-builder test

      - name: Test dash-customer
        run: pnpm --filter @roam/dash-customer test

      - name: Test dash-courier
        run: pnpm --filter @roam/dash-courier test

      - name: Test dash-merchant
        run: pnpm --filter @roam/dash-merchant test

      - name: Test fleet
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/fleet test

      - name: Test admin
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/admin test

      - name: Admin reachability
        run: node scripts/admin-reachability.mjs

      - name: Catalog contract
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/catalog-contract.mjs

      - name: Dominion Stitch contract
        run: node scripts/stitch-contract.mjs

      - name: Dominion Stitch fidelity
        run: node scripts/stitch-fidelity.mjs

      - name: Typecheck admin
        run: node scripts/admin-typecheck-baseline.mjs

      - name: Test parts catalog CSV import
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/admin exec vitest run src/utils/partsCatalogCsvImport.test.ts

      - name: Check courier fleet stamp
        run: node scripts/check-courier-fleet-stamp.mjs

      - name: Check no legacy fleet join in driver app
        run: node scripts/check-no-join-fleet-client.mjs

      - name: Validate migration SQL
        run: node scripts/validate-migration-sql.mjs

      - name: Check fleet edge duplicates
        run: node scripts/check-fleet-edge-duplicates.mjs

      - name: Check customer portal auth guard
        run: node scripts/guard-customer-portal-auth.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno test split fill station match
        run: >
          deno test --allow-read --allow-env
          supabase/functions/_fleet-server/fuel_station_match.test.ts
          supabase/functions/_fleet-server/fuel_station_match_places_parity.test.ts
          supabase/functions/_fleet-server/fuel_station_match_replay.test.ts
          supabase/functions/_fleet-server/fleet_trip_toll_replay.test.ts
          supabase/functions/_fleet-server/fuel_split_fill_station.test.ts
          supabase/functions/_fleet-server/geo_matcher_near_miss.test.ts
          supabase/functions/_fleet-server/fuel_station_match_provisional.test.ts
          supabase/functions/_fleet-server/merchant_station_registry.test.ts
          supabase/functions/_fleet-server/station_merchant_aliases.test.ts
          supabase/functions/_fleet-server/station_attach.test.ts
          supabase/functions/_fleet-server/fuel_jaa_station_heal.test.ts

      - name: Deno test places review chips
        run: deno test --allow-read --allow-env supabase/functions/explorer/place_admin.test.ts

      - name: Typecheck Plug
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter @roam/plug typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Plug journeys
        run: |
          npx playwright test -c playwright.plug.config.ts
          PLUG_E2E_APPLE=1 npx playwright test -c playwright.plug.config.ts

      - name: Deno test price engine math
        run: deno test --allow-read supabase/functions/_shared/priceEngineMath.test.ts

      # Known debt (Oct 27): ~100 Supabase client type errors in week_close/toll graph.
      # Plug journeys now reach this step; do not block green CI on that backlog.
      - name: Deno check edge functions
        continue-on-error: true
        run: deno check supabase/functions/_shared/orderToFleetTrip.ts supabase/functions/_fleet-server/workforce_invite_routes.ts supabase/functions/_fleet-server/rush_settlement_routes.ts supabase/functions/_fleet-server/fleet_module_checkout.ts supabase/functions/_fleet-server/fleet_wipay.ts supabase/functions/_fleet-server/trips_org_scope.ts supabase/functions/delivery/courierFleetAttribution.ts supabase/functions/_fleet-server/fuel_period_routes.ts

      - name: Deno check fleet-toll tag types
        run: node scripts/check-fleet-toll-types.mjs

      - name: Deno test dominion access
        run: deno test --no-check supabase/functions/_fleet-server/dominion_access.test.ts

      - name: Deno test platform MFA gate
        run: deno test --no-check supabase/functions/_fleet-server/platform_mfa_gate.test.ts

      - name: Deno test parts sourcing rules
        run: >
          deno test --allow-read --allow-env
          supabase/functions/_fleet-server/parts_resolution.test.ts
          supabase/functions/_fleet-server/catalog_privacy.test.ts

      - name: Deno test find parts
        run: >
          deno test --no-check
          supabase/functions/_fleet-server/parts_finder.test.ts
          supabase/functions/_fleet-server/parts_catalog_read.test.ts
          supabase/functions/_fleet-server/vehicleVariantLabel.test.ts
          supabase/functions/_fleet-server/fleet_find_parts_routes.test.ts

      - name: Deno test ledger read API parity
        run: >
          deno test --allow-read --allow-env
          supabase/functions/_shared/unifiedLedger/readApi.parity.test.ts

      - name: Deno test fuel recon Rev 3 controls
        run: >
          deno test --allow-read --allow-env
          supabase/functions/_fleet-server/service_line_attribution.test.ts
          supabase/functions/_fleet-server/fuel_service_line_filters.test.ts
          supabase/functions/_fleet-server/fuel_service_line_allocation.test.ts
          supabase/functions/_fleet-server/fuel_rev2_phase1_controls.test.ts
          supabase/functions/_fleet-server/fuel_nightly_statement_ledger.test.ts
          supabase/functions/_fleet-server/fuel_week_seal_h7.test.ts
          supabase/functions/_fleet-server/fuel_week_category_loader.test.ts
          supabase/functions/_fleet-server/fuel_week_category_loader_enforce.test.ts
          supabase/functions/_fleet-server/fuel_week_closable_gate_n12.test.ts
          supabase/functions/_fleet-server/fuel_week_n17_pa.test.ts
          supabase/functions/_fleet-server/fuel_week_phase4_server_cats.test.ts
          supabase/functions/_shared/directionsRoute.test.ts

      - name: Deno test toll recon durability (Phase 8)
        run: >
          deno test --allow-read --allow-env --no-check
          supabase/functions/_fleet-server/toll_period_writable.test.ts
          supabase/functions/_fleet-server/toll_finish_seal_path.test.ts
          supabase/functions/_fleet-server/toll_auto_match.test.ts
          supabase/functions/_fleet-server/toll_route_auth.test.ts
          supabase/functions/_fleet-server/toll_request_idempotency.test.ts
          supabase/functions/_fleet-server/toll_period_seal_guard.test.ts
          supabase/functions/_fleet-server/toll_ledger_request_cache.test.ts
          supabase/functions/_fleet-server/period_projector.test.ts

      - name: Deno test remittance money + residual + pause routes
        run: >
          deno test --allow-read --allow-env
          supabase/functions/delivery/remittance/money.test.ts
          supabase/functions/delivery/remittance/concurrency.test.ts
          supabase/functions/delivery/remittance/trialBalanceResidual.test.ts
          supabase/functions/delivery/remittance/pauseRoutes.test.ts
          supabase/functions/delivery/remittance/pauseThresholdSeed.test.ts
          supabase/functions/delivery/remittance/writeOffRemittance.test.ts
          supabase/functions/delivery/remittance/reverseWriteOff.test.ts
          supabase/functions/delivery/remittance/reseedSeededThresholds.test.ts
          supabase/functions/delivery/remittance/needsThresholdSeed.test.ts

      - name: Deno test Rush money rules
        run: >
          deno test --allow-env
          supabase/functions/_shared/rushMoney/refundEligibility.test.ts
          supabase/functions/_shared/rushMoney/wipayContract.test.ts
          supabase/functions/_shared/rushMoney/rushMoney.test.ts
          supabase/functions/_shared/rushMoney/postJournal.test.ts
          supabase/functions/_shared/rushMoney/journalLines.inHouse.test.ts
          supabase/functions/delivery/inHouse/taskMachine.test.ts
          supabase/functions/delivery/inHouse/pricing.test.ts
          supabase/functions/delivery/inHouse/deskRules.test.ts
          supabase/functions/delivery/admin/menuLibrary.test.ts
          supabase/functions/delivery/inHouse/customerMenu.test.ts
          supabase/functions/delivery/inHouse/dispatchOrigin.test.ts
          supabase/functions/delivery/admin/consoleAccess.test.ts
          supabase/functions/delivery/admin/geoPublishRules.test.ts
          supabase/functions/delivery/admin/geoManaged.test.ts
          tools/in-house-worker/guard.test.ts

      - name: Deno test Rush settings
        run: >
          deno test --allow-read --allow-env
          supabase/functions/_shared/rushSettings/getSetting.test.ts
          supabase/functions/_shared/rushSettings/shadowCompare.test.ts
          supabase/functions/_shared/rushSettings/registry.drift.test.ts
          supabase/functions/_shared/rushSettings/enterpriseReaders.test.ts
          supabase/functions/delivery/maintenanceMiddleware.test.ts
          supabase/functions/delivery/partnerAcceptDeadline.test.ts

      - name: Deno test In-House checkout gate
        run: >
          deno test --allow-env --no-check
          supabase/functions/delivery/inHouse/checkout.test.ts

      - name: Deno test menu-engine mirror drift
        run: >
          deno test --allow-read
          supabase/functions/_shared/menuEngine/exports.drift.test.ts

      - name: Deno test plug-core re-export drift
        run: >
          deno test --allow-read
          supabase/functions/_shared/plugCore.drift.test.ts

      - name: Deno test odometer vision prompt drift
        run: >
          deno test --allow-read
          supabase/functions/_shared/odometerVision.drift.test.ts

      - name: Deno test recon sources mirror drift
        run: >
          deno test --allow-read
          supabase/functions/_fleet-server/recon_sources_mirror.drift.test.ts

      - name: Deno test evaluate_run mirror drift
        run: >
          deno test --allow-read
          supabase/functions/_fleet-server/evaluate_run_mirror.drift.test.ts

      - name: Deno test recon close volume + toll commit money
        run: >
          deno test --allow-read --allow-env
          supabase/functions/_fleet-server/recon_close_live_volume.test.ts
          supabase/functions/_fleet-server/recon_toll_commit_money.test.ts

      - name: Deno test settlement commands
        run: >
          deno test --allow-read --allow-env
          supabase/functions/_fleet-server/settlement_commands.test.ts
          supabase/functions/_fleet-server/week_statements_restatement_guard.test.ts
          supabase/functions/_fleet-server/recon_statement_coverage.test.ts
          supabase/functions/_shared/edgeKernel.test.ts

      - name: Deno test background week projection
        run: >
          deno test --allow-read --allow-env
          supabase/functions/_fleet-server/recon_projection.test.ts
          supabase/functions/_fleet-server/recon_worker_switch.test.ts
          supabase/functions/_fleet-server/recon_week_blocker_rows.test.ts

      - name: Page reads do not run week engines
        run: node scripts/assert-no-engine-on-edge-read.mjs

      - name: Typecheck fleet Rush spine
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: node scripts/typecheck-fleet-rush.mjs

      - name: Ban Figma-style package@version imports
        run: node scripts/check-no-versioned-imports.mjs

      - name: Procurement events use column at
        run: node scripts/check-procurement-event-column.mjs

      - name: Ban bare @roam imports in fleet edge graph
        run: node scripts/check-fleet-edge-roam-imports.mjs

      - name: Typecheck rush-command
        run: pnpm --filter @roam/rush-command typecheck

      - name: Typecheck fuel-core
        run: pnpm --filter @roam/fuel-core typecheck

      - name: Plug screens have a way out
        run: node --experimental-strip-types apps/plug/scripts/check-dead-buttons.mjs

      - name: Public stations take parish from coordinates
        run: node apps/plug/scripts/check-station-parish.mjs

      - name: Typecheck fleet money spine
        run: pnpm --filter @roam/fleet typecheck:money

      - name: Check driver section (guardrails + typecheck)
        run: pnpm --filter @roam/fleet check:drivers

      - name: Typecheck admin money spine
        run: pnpm --filter @roam/admin typecheck:money

      - name: Build
        run: pnpm build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Private repo = 2,000 free Actions minutes a month (24 Nov 2026). A newer push cancels the older
# run, docs-only pushes skip the build, and the inventory e2e only runs for inventory/car-kit files.
# The secret scan always runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      inventory: ${{ steps.filter.outputs.inventory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "inventory=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "inventory=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only "$BASE" "${{ github.sha }}")
          code=false
          inventory=false
          for f in "${CHANGED[@]}"; do
            case "$f" in
              docs/*|*.md) ;;
              *) code=true ;;
            esac
            lower="$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *inventory*|*inv_*|*car-kit*|*carkit*|*car_kit*|\
              pnpm-lock.yaml|package.json|playwright*.config.ts|e2e/helpers/*|\
              .github/workflows/ci.yml|scripts/typecheck-fleet-inventory.mjs|scripts/typecheck-driver-car-kit.mjs)
                inventory=true ;;
            esac
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "inventory=$inventory" >> "$GITHUB_OUTPUT"
          echo "Changed files: ${#CHANGED[@]}  code=$code  inventory=$inventory"

  test-and-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Supabase CLI pin and v3 flags
        run: node scripts/assert-supabase-cli-pin.mjs

      - name: Check no edge→fleet imports
        run: node scripts/check-no-edge-fleet-imports.mjs

      - name: Check Dominion is the only Jamaica map
        run: node scripts/check-no-hardcoded-jamaica.mjs

      - name: Check Rush no longer names the old border table
        run: node scripts/geo-phase5-precheck.mjs

      - name: Check no admin→fleet imports
        run: node scripts/check-no-admin-fleet-imports.mjs

      - name: Check no new Supabase Storage uploads/downloads
        run: node scripts/check-supabase-storage-calls.mjs

      - name: Check toll-core parity
        run: node scripts/check-toll-core-parity.mjs

      - name: Check settlement predicate parity
        run: node scripts/verify_settlement_predicate_parity.mjs

      - name: Check service-line filter parity
        run: node scripts/verify_service_line_filter_parity.mjs

      - name: Check ledger view invoker
        run: node scripts/assert-ledger-view-invoker.mjs

      - name: Check migration files are UTF-8
        run: node scripts/assert-migrations-utf8.mjs

      - name: Check migration bodies match production fingerprints
        run: node scripts/compare-migration-md5-to-prod.mjs

      - name: Check migration version list matches production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/assert-migration-versions-parity.mjs

      - name: Check public function revoke from anon
        run: node scripts/assert-public-fn-revoke-anon.mjs

      - name: Check no settlement saveTransaction fallback
        run: node scripts/assert-no-settlement-saveTransaction-fallback.mjs

      - name: Check remittance separation
        env:
          REMITTANCE_S6_DIFF: '1'
        run: node scripts/check-remittance-separation.mjs

      - name: Check projection flags wired
        run: node scripts/check-projection-flags-wired.mjs

      - name: Check fuel-core parity
        run: node scripts/check-fuel-core-parity.mjs

      - name: Check no unused fuel screen files (fuel audit F-27)
        run: node scripts/check-unused-files.mjs

      - name: Check no naive date slice (one-week rule)
        run: node scripts/check-no-naive-date-slice.mjs

      - name: Check toll week-rule SQL drift
        run: node scripts/gen-toll-week-rule-sql.mjs --check

      - name: Check toll handlers avoid toll_system
        run: node scripts/check-toll-system-not-from-user-handlers.mjs

      - name: Check client route contract
        run: node scripts/check-client-route-contract.mjs

      - name: Check no ledger fetch-all pattern (L-14)
        run: node scripts/assert-no-ledger-fetch-all.mjs

      - name: Check fuel org-scope
        run: node scripts/check-fuel-org-scope.mjs

      - name: Check statement summary org-scope
        run: node scripts/check-statement-org-scope.mjs

      - name: Check no client service-line derivation (fuel)
        run: node scripts/check-no-client-service-line-derivation.mjs

      - name: Test toll-core
        run: pnpm --filter @roam/toll-core test

      - name: Test fuel-core
        run: pnpm --filter @roam/fuel-core test

      - name: Test finance-core
        run: pnpm --filter @roam/finance-core test

      - name: Test dash-pricing
        run: pnpm --filter @roam/dash-pricing test

      - name: Test menu-engine
        run: pnpm --filter @roam/menu-engine test

      - name: Test menu-builder
        run: pnpm --filter @roam/menu-builder test

      - name: Test dash-customer
        run: pnpm --filter @roam/dash-customer test

      - name: Test dash-courier
        run: pnpm --filter @roam/dash-courier test

      - name: Test dash-merchant
        run: pnpm --filter @roam/dash-merchant test


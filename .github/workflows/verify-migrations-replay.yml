# Verifies supabase/migrations/*.sql replays cleanly, in filename order, from an empty
# database. No existing workflow does this today (deploy-supabase-edge.yml only deploys
# Edge Functions, never runs `supabase db push`/migrations), so a migration-ordering bug
# can currently ship silently. This is exactly the class of bug tracked in
# docs/adr/0001-migration-reorder-decision.md.
#
# Parts checks have their own workflow. Full-stack replay also runs on migration PRs (ADR 0001).
name: Verify Migrations Replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/verify-migrations-replay.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli

      - name: Start local Supabase stack (applies migrations in filename order)
        run: |
          set -euo pipefail
          supabase start

      - name: Confirm all migrations applied
        run: |
          set -euo pipefail
          supabase migration list

      - name: Parts sourcing SQL checks
        run: |
          set -euo pipefail
          supabase db query -f supabase/tests/parts_rev2_checks.sql
          supabase db query -f supabase/tests/vehicle_database_rebuild_checks.sql
          supabase db query -f supabase/tests/places_checks.sql
          supabase db query -f supabase/tests/price_engine_checks.sql
          supabase db query -f supabase/tests/catalog_research_claim_checks.sql

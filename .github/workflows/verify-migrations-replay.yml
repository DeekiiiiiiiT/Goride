# Verifies supabase/migrations/*.sql replays cleanly, in filename order, from an empty
# database. No existing workflow does this today (deploy-supabase-edge.yml only deploys
# Edge Functions, never runs `supabase db push`/migrations), so a migration-ordering bug
# can currently ship silently. This is exactly the class of bug tracked in
# docs/adr/0001-migration-reorder-decision.md.
#
# Parts checks have their own workflow. Full-stack replay also runs on migration PRs (ADR 0001).
name: Verify Migrations Replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/verify-migrations-replay.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli

      # Database only (same as parts-sql-checks.yml): `supabase start` also serves the edge
      # functions, whose entry bundles (e.g. fleet-core/index.ts) are built at deploy time and
      # never committed, so it failed on every migration PR before reaching a single migration.
      - name: Start the database
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if supabase db start; then
              exit 0
            fi
            echo "supabase db start failed (attempt ${attempt}); waiting before retry"
            sleep $((attempt * 20))
          done
          echo "supabase db start failed after retries"
          exit 1

      - name: Replay all migrations from empty, in filename order
        run: |
          set -euo pipefail
          supabase db reset --no-seed

      - name: Confirm all migrations applied
        run: |
          set -euo pipefail
          supabase migration list

      - name: Parts sourcing SQL checks
        run: |
          set -euo pipefail
          # psql, not `supabase db query`: the check files hold many statements, which
          # `db query` refuses ("cannot insert multiple commands into a prepared statement").
          # Same way parts-sql-checks.yml runs them.
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          for f in parts_rev2_checks vehicle_database_rebuild_checks places_checks price_engine_checks catalog_research_claim_checks research_engine_checks saved_page_parts_checks part_pictures_checks part_type_learning_checks part_type_auto_sort_checks; do
            docker cp "supabase/tests/${f}.sql" "$db_container":"/tmp/${f}.sql"
            docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f "/tmp/${f}.sql"
          done

      - name: 'Server code never selects * from the two new tables'
        run: |
          set -euo pipefail
          # D8.9 of docs/part-type-learning-audit.md §2: the server reads part_type_suggestion_dismissal and
          # research_saved_page_diagram by explicit column list only, never "*".
          # The client chain can wrap over lines, so take the table call plus the next two lines.
          if grep -rn -A2 -E "from\(['\"](part_type_suggestion_dismissal|research_saved_page_diagram)['\"]\)" supabase/functions \
               | grep -E "select\([[:space:]]*['\"]\*"; then
            echo "select(\"*\") found on a table the plan says to read by column list (D8.9)" >&2
            exit 1
          fi

name: Fuel close job sweeper

# Manual backup for the database sweeper. Picks up fuel close jobs the button
# queued, including a job whose worker died after the money was posted.
# Does not post a second time.

# The 15-minute rescue runs in the database (pg_cron). GitHub schedules were
# dropped, so this workflow is a manual backup only.
on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Finish queued fuel close jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLEET_CRON_SECRET: ${{ secrets.FLEET_CRON_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s/^[[:space:]]*//')"
          SERVICE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s/^[[:space:]]*//')"
          CRON_VAL="$(printf '%s' "${FLEET_CRON_SECRET:-${CRON_SECRET:-}}" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s/^[[:space:]]*//')"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
          CURL_ARGS=(
            -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST
            "${SUPABASE_URL}/functions/v1/fleet-fuel/fuel/period-jobs/sweep"
            -H "Authorization: Bearer ${SERVICE_KEY}"
            -H "apikey: ${SERVICE_KEY}"
            -H "Content-Type: application/json"
            -d '{}'
          )
          if [ -n "$CRON_VAL" ]; then
            CURL_ARGS+=(-H "X-Fleet-Cron-Secret: ${CRON_VAL}")
          fi
          RESP="$(curl "${CURL_ARGS[@]}")"
          echo "$RESP"
          echo "$RESP" | grep -q 'HTTP_CODE:200' || exit 1

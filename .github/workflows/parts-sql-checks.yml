# Parts catalog checks. Database only, no Studio, Auth, Storage, or seed.
# A fresh database can replay through the parts migrations. The check file
# has more than one statement, so it is run with psql. The full-stack replay
# in verify-migrations-replay.yml stays manual.
name: Parts SQL checks

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/parts_rev2_checks.sql'
      - 'supabase/tests/guided_parts_checks.sql'
      - 'supabase/tests/vehicle_database_rebuild_checks.sql'
      - 'supabase/tests/places_checks.sql'
      - 'supabase/tests/price_engine_checks.sql'
      - 'supabase/tests/parts_import_checks.sql'
      - 'supabase/tests/parts_auto_match_checks.sql'
      - 'supabase/tests/add_a_part_self_serve_checks.sql'
      - 'supabase/tests/add_a_part_car_specs_smoke.sql'
      - 'supabase/tests/add_a_part_done_checks.sql'
      - 'supabase/tests/maintenance_master_checks.sql'
      - 'supabase/tests/maintenance_master_fixtures.sql'
      - 'supabase/tests/20261106131300_mm_go_live_order_fixture.sql'
      - 'supabase/tests/engine_sections_checks.sql'
      - 'supabase/tests/engine_sections_used_ids_test.sql'
      - '.github/workflows/parts-sql-checks.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/parts_rev2_checks.sql'
      - 'supabase/tests/guided_parts_checks.sql'
      - 'supabase/tests/vehicle_database_rebuild_checks.sql'
      - 'supabase/tests/places_checks.sql'
      - 'supabase/tests/price_engine_checks.sql'
      - 'supabase/tests/parts_import_checks.sql'
      - 'supabase/tests/parts_auto_match_checks.sql'
      - 'supabase/tests/add_a_part_self_serve_checks.sql'
      - 'supabase/tests/add_a_part_car_specs_smoke.sql'
      - 'supabase/tests/add_a_part_done_checks.sql'
      - 'supabase/tests/maintenance_master_checks.sql'
      - 'supabase/tests/maintenance_master_fixtures.sql'
      - 'supabase/tests/20261106131300_mm_go_live_order_fixture.sql'
      - 'supabase/tests/engine_sections_checks.sql'
      - 'supabase/tests/engine_sections_used_ids_test.sql'
      - '.github/workflows/parts-sql-checks.yml'
  workflow_dispatch:

jobs:
  parts-sql:
    runs-on: ubuntu-latest
    env:
      # ECR public anonymous pulls hit "Data limit exceeded" on shared runners. Pull every CLI image from Docker Hub.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migration files are UTF-8
        run: node scripts/assert-migrations-utf8.mjs

      - name: Check migration bodies match production fingerprints
        run: node scripts/compare-migration-md5-to-prod.mjs

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli

      - name: Start the database
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if supabase db start; then
              exit 0
            fi
            echo "supabase db start failed (attempt ${attempt}); waiting before retry"
            sleep $((attempt * 20))
          done
          echo "supabase db start failed after retries"
          exit 1

      - name: Apply migrations without seed data
        run: |
          set -euo pipefail
          supabase db reset --no-seed

      - name: Parts sourcing SQL checks
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          docker cp supabase/tests/parts_rev2_checks.sql "$db_container":/tmp/parts_rev2_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/parts_rev2_checks.sql
          docker cp supabase/tests/guided_parts_checks.sql "$db_container":/tmp/guided_parts_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/guided_parts_checks.sql
          docker cp supabase/tests/vehicle_database_rebuild_checks.sql "$db_container":/tmp/vehicle_database_rebuild_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/vehicle_database_rebuild_checks.sql
          docker cp supabase/tests/places_checks.sql "$db_container":/tmp/places_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/places_checks.sql
          docker cp supabase/tests/price_engine_checks.sql "$db_container":/tmp/price_engine_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/price_engine_checks.sql
          docker cp supabase/tests/parts_import_checks.sql "$db_container":/tmp/parts_import_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/parts_import_checks.sql
          docker cp supabase/tests/parts_auto_match_checks.sql "$db_container":/tmp/parts_auto_match_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/parts_auto_match_checks.sql
          docker cp supabase/tests/add_a_part_self_serve_checks.sql "$db_container":/tmp/add_a_part_self_serve_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/add_a_part_self_serve_checks.sql
          docker cp supabase/tests/add_a_part_car_specs_smoke.sql "$db_container":/tmp/add_a_part_car_specs_smoke.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/add_a_part_car_specs_smoke.sql
          docker cp supabase/tests/add_a_part_done_checks.sql "$db_container":/tmp/add_a_part_done_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/add_a_part_done_checks.sql
          docker cp supabase/tests/maintenance_master_checks.sql "$db_container":/tmp/maintenance_master_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/maintenance_master_checks.sql
          docker cp supabase/tests/maintenance_master_fixtures.sql "$db_container":/tmp/maintenance_master_fixtures.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/maintenance_master_fixtures.sql
          docker cp supabase/tests/20261106131300_mm_go_live_order_fixture.sql "$db_container":/tmp/20261106131300_mm_go_live_order_fixture.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/20261106131300_mm_go_live_order_fixture.sql
          docker cp supabase/tests/engine_sections_checks.sql "$db_container":/tmp/engine_sections_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/engine_sections_checks.sql
          docker cp supabase/tests/engine_sections_used_ids_test.sql "$db_container":/tmp/engine_sections_used_ids_test.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/engine_sections_used_ids_test.sql

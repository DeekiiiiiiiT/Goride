# Parts catalog checks. Database only, no Studio, Auth, Storage, or seed.
# A fresh database can replay through the parts migrations. The check file
# has more than one statement, so it is run with psql. The full-stack replay
# in verify-migrations-replay.yml stays manual.
name: Parts SQL checks

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/parts_rev2_checks.sql'
      - 'supabase/tests/vehicle_database_rebuild_checks.sql'
      - 'supabase/tests/places_checks.sql'
      - 'supabase/tests/price_engine_checks.sql'
      - '.github/workflows/parts-sql-checks.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/parts_rev2_checks.sql'
      - 'supabase/tests/vehicle_database_rebuild_checks.sql'
      - 'supabase/tests/places_checks.sql'
      - 'supabase/tests/price_engine_checks.sql'
      - '.github/workflows/parts-sql-checks.yml'
  workflow_dispatch:

jobs:
  parts-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        env:
          SUPABASE_CLI_VERSION: "2.99.0"
        run: |
          set -euo pipefail
          url="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/supabase.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin
          supabase --version

      # Avoid supabase db start (pulls Realtime/etc from ECR and hits Data limit exceeded).
      # One Postgres image + db reset against its URL is enough for SQL checks.
      - name: Cache Supabase Postgres image
        id: cache-pg
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-postgres-17.6.1.106.tar
          key: supabase-postgres-17.6.1.106-v2

      - name: Start Postgres only
        env:
          PG_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.106
          PG_FALLBACK: supabase/postgres:17.6.1.106
        run: |
          set -euo pipefail
          if [ -f /tmp/supabase-postgres-17.6.1.106.tar ]; then
            docker load -i /tmp/supabase-postgres-17.6.1.106.tar
          else
            pulled=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if docker pull "$PG_IMAGE" || docker pull "$PG_FALLBACK"; then
                pulled=1
                break
              fi
              echo "image pull failed (attempt ${attempt}); waiting"
              sleep $((attempt * 20))
            done
            test "$pulled" = 1
            if ! docker image inspect "$PG_IMAGE" >/dev/null 2>&1; then
              docker tag "$PG_FALLBACK" "$PG_IMAGE"
            fi
            docker save "$PG_IMAGE" -o /tmp/supabase-postgres-17.6.1.106.tar
          fi
          docker rm -f parts-sql-pg >/dev/null 2>&1 || true
          docker run -d --name parts-sql-pg \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 54322:5432 \
            "$PG_IMAGE"
          for _ in $(seq 1 90); do
            if ! docker ps --format '{{.Names}}' | grep -q '^parts-sql-pg$'; then
              echo "parts-sql-pg exited early"
              docker logs parts-sql-pg || true
              exit 1
            fi
            if docker exec parts-sql-pg pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec parts-sql-pg pg_isready -U postgres

      - name: Apply migrations without seed data
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          supabase db reset --db-url "$SUPABASE_DB_URL" --no-seed

      - name: Parts sourcing SQL checks
        run: |
          set -euo pipefail
          db_container=parts-sql-pg
          docker cp supabase/tests/parts_rev2_checks.sql "$db_container":/tmp/parts_rev2_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/parts_rev2_checks.sql
          docker cp supabase/tests/vehicle_database_rebuild_checks.sql "$db_container":/tmp/vehicle_database_rebuild_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/vehicle_database_rebuild_checks.sql
          docker cp supabase/tests/places_checks.sql "$db_container":/tmp/places_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/places_checks.sql
          docker cp supabase/tests/price_engine_checks.sql "$db_container":/tmp/price_engine_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/price_engine_checks.sql

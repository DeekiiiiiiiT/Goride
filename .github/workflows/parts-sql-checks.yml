# Parts catalog checks. Database only, no Studio, Auth, Storage, or seed.
# A fresh database can replay through the parts migrations. The check file
# has more than one statement, so it is run with psql. The full-stack replay
# in verify-migrations-replay.yml stays manual.
name: Parts SQL checks

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/parts_rev2_checks.sql'
      - 'supabase/tests/vehicle_database_rebuild_checks.sql'
      - 'supabase/tests/places_checks.sql'
      - 'supabase/tests/price_engine_checks.sql'
      - '.github/workflows/parts-sql-checks.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/parts_rev2_checks.sql'
      - 'supabase/tests/vehicle_database_rebuild_checks.sql'
      - 'supabase/tests/places_checks.sql'
      - 'supabase/tests/price_engine_checks.sql'
      - '.github/workflows/parts-sql-checks.yml'
  workflow_dispatch:

jobs:
  parts-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        env:
          SUPABASE_CLI_VERSION: "2.99.0"
        run: |
          set -euo pipefail
          url="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/supabase.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin
          supabase --version

      # ECR anonymous pulls hit "Data limit exceeded". Prefetch + cache the images db start needs.
      - name: Cache Supabase images
        id: cache-images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images
          key: supabase-db-start-images-17.6.1.106-realtime-v2.86.3

      - name: Prefetch images for db start
        run: |
          set -euo pipefail
          mkdir -p /tmp/supabase-images
          pull_one() {
            local ecr="$1"
            local hub="$2"
            local tar="/tmp/supabase-images/$(echo "$ecr" | tr '/:' '__').tar"
            if [ -f "$tar" ]; then
              docker load -i "$tar"
              return 0
            fi
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if docker pull "$ecr" || docker pull "$hub"; then
                ok=1
                break
              fi
              echo "pull failed for $ecr (attempt ${attempt}); waiting"
              sleep $((attempt * 25))
            done
            test "$ok" = 1
            if ! docker image inspect "$ecr" >/dev/null 2>&1; then
              docker tag "$hub" "$ecr"
            fi
            docker save "$ecr" -o "$tar"
          }
          pull_one public.ecr.aws/supabase/postgres:17.6.1.106 supabase/postgres:17.6.1.106
          pull_one public.ecr.aws/supabase/realtime:v2.86.3 supabase/realtime:v2.86.3

      - name: Start the database
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if supabase db start; then
              exit 0
            fi
            echo "supabase db start failed (attempt ${attempt}); waiting before retry"
            sleep $((attempt * 20))
          done
          echo "supabase db start failed after retries"
          exit 1

      - name: Apply migrations without seed data
        run: |
          set -euo pipefail
          supabase db reset --no-seed

      - name: Parts sourcing SQL checks
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          docker cp supabase/tests/parts_rev2_checks.sql "$db_container":/tmp/parts_rev2_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/parts_rev2_checks.sql
          docker cp supabase/tests/vehicle_database_rebuild_checks.sql "$db_container":/tmp/vehicle_database_rebuild_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/vehicle_database_rebuild_checks.sql
          docker cp supabase/tests/places_checks.sql "$db_container":/tmp/places_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/places_checks.sql
          docker cp supabase/tests/price_engine_checks.sql "$db_container":/tmp/price_engine_checks.sql
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/price_engine_checks.sql
